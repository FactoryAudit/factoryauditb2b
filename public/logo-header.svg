<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-label="FactoryAuditB2B">
  <defs>
    <linearGradient id="hdrShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c96235"/>
      <stop offset="100%" stop-color="#e07a49"/>
    </linearGradient>
  </defs>

  <!-- 图标：盾牌 + 工厂 + 放大镜 + 对勾 -->
  <g transform="translate(2 4) scale(0.28)">
    <path d="M 14 0 L 186 0 L 186 78 Q 186 178 100 200 Q 14 178 14 78 Z"
          fill="url(#hdrShield)" stroke="#e07a49" stroke-width="3"/>
    <g fill="#FFFFFF" stroke="#c96235" stroke-width="4" stroke-linejoin="round">
      <rect x="50" y="80" width="44" height="62"/>
      <rect x="94" y="56" width="26" height="86"/>
      <rect x="120" y="98" width="36" height="44"/>
      <rect x="140" y="40" width="12" height="28"/>
    </g>
    <g fill="#f0b795">
      <rect x="58" y="90" width="8" height="8"/>
      <rect x="78" y="90" width="8" height="8"/>
      <rect x="58" y="110" width="8" height="8"/>
      <rect x="78" y="110" width="8" height="8"/>
      <rect x="100" y="68" width="6" height="6"/>
      <rect x="100" y="82" width="6" height="6"/>
      <rect x="100" y="96" width="6" height="6"/>
      <rect x="128" y="108" width="6" height="6"/>
      <rect x="128" y="122" width="6" height="6"/>
    </g>
    <g transform="translate(95 100)">
      <circle cx="0" cy="0" r="36" fill="#FFFFFF" fill-opacity="0.97"
              stroke="#e07a49" stroke-width="7"/>
      <path d="M -14 2 L -4 12 L 14 -8" fill="none"
            stroke="#1f7a5a" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="25" y1="25" x2="52" y2="52"
            stroke="#e07a49" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 文字：FactoryAudit（墨黑）+ B2B（陶土橙，与 accent 变量一致）
       注：B2B 原为 #f7e7de（奶油白），在浅色底 #fbfaf7 上对比度约 1.05:1，肉眼几乎不可见，
       与 logo-light.svg 的 #e07a49 口径也不一致，故统一为 accent 橙。
       坑：XML 注释内不得出现连续两个连字符，写“两个连字符 + accent”会让整个 SVG 解析失败、
       浏览器只显示 alt 文本（表现为“图片裂开”）。此处刻意不写该变量名。 -->
  <text x="72" y="43"
        font-family="Poppins, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.8">
    <tspan fill="#171717">FactoryAudit</tspan><tspan fill="#e07a49">B2B</tspan>
  </text>
</svg>
