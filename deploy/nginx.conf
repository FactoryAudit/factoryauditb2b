# =============================================================================
# FactoryAuditB2B — nginx 反向代理配置（宝塔站点）
#
# 放置位置：宝塔 → 网站 → 你的站点 → 配置文件
#   宝塔默认生成 /www/server/panel/vhost/nginx/<域名>.conf。
#   把下面【BEGIN 反向代理】到【END 反向代理】之间的内容，
#   粘贴进该站点的 `server { ... }`（80 端口那个）里即可。
#   SSL 证书请用宝塔的「SSL」标签页申请 Let's Encrypt —— 它会自动追加 443 段，
#   不要手写证书路径（续期时会失配）。
#
# 🔴 为什么 HOSTNAME 要设 127.0.0.1：
#   应用只监听回环，公网只能经 nginx 进来 ⇒ SSL、限流、访问日志一处都不漏。
# =============================================================================

#────────────── BEGIN 反向代理（粘进网站的 server{} 块）──────────────

    # 上传上限：供应商证据 / 工厂照片走 multipart，默认 1m 会 413。
    client_max_body_size 25m;

    # 反代到本机 Node 应用
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 真实访客信息必须透传，否则应用里的 IP 限流会把所有人算成同一个人
        # （nginx 所在机器的 127.0.0.1），等于限流失效。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Next 的响应可能较大（预渲染 HTML + RSC payload），放宽缓冲
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 不要让 nginx 改写编码（应用已自行处理 9 语与 brotli/gzip）
        proxy_set_header Accept-Encoding "";
    }

    # Next 的构建产物带内容哈希 ⇒ 可以永久缓存。
    # 这一条能显著降低回源量，务必保留。
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 给搜索/AI 爬虫用的静态声明文件，短缓存即可
    location = /robots.txt   { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; expires 1h; }
    location = /sitemap.xml  { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; expires 1h; }
    location = /llms.txt     { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; expires 1h; }

    # 🔴 后台接口绝不能进任何缓存层（含 CDN/浏览器）
    location /api/admin/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # 支付 webhook：PayPal/Stripe 会重投，禁止任何缓存与缓冲改写
    location /api/paypal/  { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; add_header Cache-Control "no-store" always; }
    location /api/stripe/  { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; add_header Cache-Control "no-store" always; }

#────────────── END 反向代理 ──────────────

# ── 可选：全站 gzip（宝塔「网站设置」里也有开关，二选一即可）─────────────────
# 若在宝塔面板里开了 gzip，就不需要下面这段。
#
# gzip              on;
# gzip_vary         on;
# gzip_min_length   1024;
# gzip_comp_level   5;
# gzip_types        text/plain text/css application/json application/javascript
#                   application/x-javascript text/xml application/xml
#                   application/xml+rss text/javascript image/svg+xml;
