# GitHub Actions：自动构建并部署到 Cloudflare Workers（OpenNext）— V2.0 无数据库版
# 触发：push 到 main / 手动触发
# 必填仓库 Secrets：
#   CLOUDFLARE_API_TOKEN       Cloudflare API Token（权限：Workers Scripts Edit + Account Settings Read）
#   CLOUDFLARE_ACCOUNT_ID      Cloudflare 账户 ID（dash.cloudflare.com 右下角）
# 可选 Secrets（运行时经 wrangler secret put 注入，未配置时跳过写入）：
#   DEEPSEEK_API_KEY / NEXT_PUBLIC_WHATSAPP_NUMBER / GOOGLE_SITE_VERIFICATION / BING_SITE_VERIFICATION
#   MAIL_PROVIDER / MAIL_HTTP_KEY / MAIL_HTTP_URL / NOTIFY_ADMIN_EMAIL / FROM_EMAIL
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext
        id: build
        run: |
          set -o pipefail
          npx @opennextjs/cloudflare@1.20.5 build 2>&1 | tee opennext-build.log
        continue-on-error: true
        env:
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::OpenNext build failed. Log tail:"
          tail -c 6000 opennext-build.log | sed 's/%/%25/g; s/\r//g; s/\n/%0A/g' | sed 's/^/::error::/'
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opennext-build-log
          path: opennext-build.log
          if-no-files-found: ignore

      - name: Set runtime secrets (skip empty)
        shell: bash
        run: |
          set -e
          put_secret() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "skip $name (empty)"
            fi
          }
          put_secret DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"
          put_secret NEXT_PUBLIC_WHATSAPP_NUMBER "$NEXT_PUBLIC_WHATSAPP_NUMBER"
          put_secret GOOGLE_SITE_VERIFICATION "$GOOGLE_SITE_VERIFICATION"
          put_secret BING_SITE_VERIFICATION "$BING_SITE_VERIFICATION"
          put_secret MAIL_PROVIDER "$MAIL_PROVIDER"
          put_secret MAIL_HTTP_KEY "$MAIL_HTTP_KEY"
          put_secret MAIL_HTTP_URL "$MAIL_HTTP_URL"
          put_secret NOTIFY_ADMIN_EMAIL "$NOTIFY_ADMIN_EMAIL"
          put_secret FROM_EMAIL "$FROM_EMAIL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          MAIL_HTTP_KEY: ${{ secrets.MAIL_HTTP_KEY }}
          MAIL_HTTP_URL: ${{ secrets.MAIL_HTTP_URL }}
          NOTIFY_ADMIN_EMAIL: ${{ secrets.NOTIFY_ADMIN_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
