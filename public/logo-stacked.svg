<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" role="img" aria-label="FactoryAuditB2B — Evaluate. Verify. Audit.">
  <defs>
    <linearGradient id="stackedShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2D5B"/>
      <stop offset="100%" stop-color="#1E6FEB"/>
    </linearGradient>
  </defs>

  <!-- 顶部图标 -->
  <g transform="translate(60 10)">
    <path d="M 0 0 L 100 0 L 100 50 Q 100 110 50 120 Q 0 110 0 50 Z"
          fill="url(#stackedShield)" stroke="#1E6FEB" stroke-width="2"/>
    <g fill="#FFFFFF" stroke="#0B2D5B" stroke-width="2" stroke-linejoin="round">
      <rect x="22" y="46" width="26" height="36"/>
      <rect x="48" y="32" width="14" height="50"/>
      <rect x="62" y="58" width="20" height="24"/>
      <rect x="72" y="22" width="6" height="14"/>
    </g>
    <g fill="#0EA5FF">
      <rect x="26" y="52" width="4" height="4"/>
      <rect x="36" y="52" width="4" height="4"/>
      <rect x="26" y="62" width="4" height="4"/>
      <rect x="36" y="62" width="4" height="4"/>
      <rect x="52" y="38" width="3" height="3"/>
      <rect x="66" y="64" width="3" height="3"/>
    </g>
    <g transform="translate(40 50)">
      <circle cx="0" cy="0" r="20" fill="#FFFFFF" fill-opacity="0.96"
              stroke="#1E6FEB" stroke-width="4"/>
      <path d="M -8 1 L -2 7 L 8 -5" fill="none"
            stroke="#22C55E" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="14" y1="14" x2="30" y2="30"
            stroke="#1E6FEB" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 文字（中央对齐） -->
  <g font-family="Poppins, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
     text-anchor="middle">
    <text x="110" y="190" font-size="32" font-weight="700" letter-spacing="-1">
      <tspan fill="#0B2D5B">FactoryAudit</tspan><tspan fill="#0EA5FF">B2B</tspan>
    </text>
    <text x="110" y="220" font-size="12" font-weight="500" fill="#6B7280" letter-spacing="6">
      Evaluate. Verify. Audit.
    </text>
  </g>
</svg>
